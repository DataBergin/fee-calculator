name: Deploy

# Production deploy to Vercel. Runs on push to main (after the branch is merged)
# or manually via "Run workflow". It no-ops gracefully until the repo has the
# required secrets, so it never fails before you've configured Vercel.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       Personal token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      From `vercel link` (.vercel/project.json) or dashboard
#   VERCEL_PROJECT_ID  From `vercel link` (.vercel/project.json) or dashboard
# Also set ALLOWED_ORIGIN in the Vercel project env to your production domain.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_TOKEN secret is not set; skipping deploy. See README.'
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: '20'

      - name: Install Vercel CLI
        if: steps.creds.outputs.configured == 'true'
        run: npm install -g vercel

      - name: Pull Vercel environment
        if: steps.creds.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.creds.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        if: steps.creds.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
